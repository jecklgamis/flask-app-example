name: Perf Test
on:
  workflow_dispatch:
jobs:
  perf-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install resonate
        run: go install github.com/jecklgamis/resonate/cmd/resonate@latest
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start app
        run: |
          nohup FLASK_APP=app flask run --host 0.0.0.0 --port 8080 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/ && break; sleep 1; done
      - name: Run load test
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./run-perf-tests.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-report
          path: perf-tests/*-report.*
